name: Validate Prodi9al Hyprland Config

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@master
        with:
          scandir: Scripts
          exclude: Configs

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ruff
        run: pip install ruff
      - name: Run Ruff on Python scripts
        run: ruff check Configs/.local/lib/prodi/ --select E,F,W,C --output-format grouped || true

  lua-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Validate Lua syntax
        run: |
          for f in Configs/.config/hypr/hyprland.lua Configs/.local/lib/prodi/*.lua; do
            [ -f "$f" ] || continue
            echo "Checking $f..."
            luac -p "$f" || exit 1
          done

  json-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON/JSONC files
        run: |
          for f in $(find Configs -name "*.json" -o -name "*.jsonc" | grep -v node_modules); do
            echo "Checking $f..."
            python3 -c "import json; json.load(open('$f'))" || exit 1
          done

  manifest-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify dots.toml and restore_cfg.lst consistency
        run: python3 Scripts/validate_manifest.py

  hardcoded-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for hardcoded personal paths
        run: |
          if grep -rn "/home/prodi9al" Configs/ Scripts/ Source/ README.md KEYBINDINGS.md 2>/dev/null; then
            echo "ERROR: Hardcoded /home/prodi9al paths found!"
            exit 1
          else
            echo "No hardcoded personal paths found."
          fi
