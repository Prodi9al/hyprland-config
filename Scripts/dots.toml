# Prodi9al Hyprland Config — Dots Manifest
# Lists all dot groups and their deployment order.
# Action: "sync" = copy/overwrite files, "preserve" = copy only if missing

include = [
    "Scripts/dots/hyprland.toml",
    "Scripts/dots/waybar.toml",
    "Scripts/dots/dunst.toml",
    "Scripts/dots/kitty.toml",
    "Scripts/dots/rofi.toml",
    "Scripts/dots/dolphin.toml",
    "Scripts/dots/electron.toml",
    "Scripts/dots/fastfetch.toml",
    "Scripts/dots/fish.toml",
    "Scripts/dots/hypridle.toml",
    "Scripts/dots/hyprlock.toml",
    "Scripts/dots/hyprsunset.toml",
    "Scripts/dots/libinput-gestures.toml",
    "Scripts/dots/lsd.toml",
    "Scripts/dots/prodi.toml",
    "Scripts/dots/spotify.toml",
    "Scripts/dots/swaync-config.toml",
    "Scripts/dots/wallbash.toml",
    "Scripts/dots/wallbash-vim.toml",
    "Scripts/dots/wlogout.toml",
    "Scripts/dots/zsh.toml",
    "Scripts/dots/archives.toml",
    "Scripts/dots/baloofilerc.toml",
    "Scripts/dots/code.toml",
    "Scripts/dots/deps.toml",
    "Scripts/dots/swaync.toml",
]

# Global theme settings — applied after all dot groups are deployed
[theme]
enabled = true
generate_state = true
generate_wallpaper_cache = true
update_waybar = true
default_theme = "Catppuccin-Mocha"

# Restore helpers (app/link restoration after config deploy)
[restore]
enable_app_restore = true
enable_link_restore = true
